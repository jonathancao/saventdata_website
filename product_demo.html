<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SaventData Cockpit</title>

    <link rel="stylesheet" href="SaventData_files/style.min.css" />
    <link rel="stylesheet" href="SaventData_files/style.css" />
    <link href="assets/img/favicon.ico" rel="icon">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        .demo-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .demo-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid #222;
        }

        .demo-brand {
            display: flex;
            align-items: center;
            height: 100%;
        }

        .demo-brand img {
            display: block;
            width: auto;
            height: 48px;
        }

        /* Intro */
        .intro {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            padding: 42px 30px 28px;
        }

        .intro h1 {
            margin: 0 0 10px;
            font-size: 32px;
            line-height: 1.2;
            font-weight: 600;
            letter-spacing: -0.8px;
        }

        .intro p {
            margin: 0;
            color: #aaa;
            font-size: 16px;
            line-height: 1.5;
        }

        /* Demo */
        .demo-container {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px 50px;
        }

        .demo {
            width: 100%;
            aspect-ratio: 16 / 9;
            min-height: 600px;
            background: #111;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            overflow: hidden;
        }

        .demo iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .header {
                padding: 0 20px;
            }

            .intro {
                padding: 30px 20px 20px;
            }

            .intro h1 {
                font-size: 26px;
            }

            .demo-container {
                padding: 0 15px 30px;
            }

            .demo {
                min-height: 500px;
                border-radius: 6px;
            }
        }
    </style>
</head>

<body>

<div class="demo-page">

    <header class="demo-header">
        <a href="https://www.saventdata.com/" class="demo-brand">
            <img
                src="./SaventData_files/saventdata-white.svg"
                alt="SaventData"
            >
        </a>
    </header>

    <section class="intro">
        <h1>SaventData Cockpit</h1>
        <p>
            Turn behavioral data into the next best action for every user
        </p>
    </section>

    <main class="demo-container">
        <div class="demo">

            <iframe
                src="https://app.supademo.com/demo/cmtugs2s300h5xf0j2a9q03i1"
                title="SaventData Cockpit Demo"
                allow="fullscreen"
                loading="lazy">
            </iframe>

        </div>
    </main>

</div>

</body>
</html>
